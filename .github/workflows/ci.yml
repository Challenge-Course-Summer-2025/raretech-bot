name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -f Dockerfile -t raretech-bot .

      - name: Run flake8 in Docker
        run: docker run --rm raretech-bot flake8 .

  health-check:
    name: Build & Health Check
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -f Dockerfile -t raretech-bot .

      - name: Run API and check endpoint
        env:
          AWS_REGION: dummy
          X_API_KEY: dummy
          X_API_SECRET: dummy
          X_ACCESS_TOKEN: dummy
          X_ACCESS_TOKEN_SECRET: dummy
          QIITA_ORGANIZATION_ID: dummy
          MATTERMOST_WEBHOOK_URL: dummy
          X_USERNAME: dummy
          DB_TABLE_POST_HISTORY: dummy
          DB_TABLE_TEMPLATE: dummy
          SHORTIO_ACCESS_TOKEN: dummy
          DB_TABLE_ARTICLE_CLICKS: dummy
          DB_TABLE_STATIC_LINK_CLICKS: dummy
          DB_TABLE_API_STATUS: dummy
        run: |
          docker run -d -p 8000:8000 --name test-api \
            -e AWS_REGION=$AWS_REGION \
            -e X_API_KEY=$X_API_KEY \
            -e X_API_SECRET=$X_API_SECRET \
            -e X_ACCESS_TOKEN=$X_ACCESS_TOKEN \
            -e X_ACCESS_TOKEN_SECRET=$X_ACCESS_TOKEN_SECRET \
            -e QIITA_ORGANIZATION_ID=$QIITA_ORGANIZATION_ID \
            -e MATTERMOST_WEBHOOK_URL=$MATTERMOST_WEBHOOK_URL \
            -e X_USERNAME=$X_USERNAME \
            -e DB_TABLE_POST_HISTORY=$DB_TABLE_POST_HISTORY \
            -e DB_TABLE_TEMPLATE=$DB_TABLE_TEMPLATE \
            -e SHORTIO_ACCESS_TOKEN=$SHORTIO_ACCESS_TOKEN \
            -e DB_TABLE_ARTICLE_CLICKS=$DB_TABLE_ARTICLE_CLICKS \
            -e DB_TABLE_STATIC_LINK_CLICKS=$DB_TABLE_STATIC_LINK_CLICKS \
            -e DB_TABLE_API_STATUS=$DB_TABLE_API_STATUS \
            raretech-bot
          sleep 5
          curl -f http://localhost:8000 || (docker logs test-api && exit 1)
